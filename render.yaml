services:
  - type: web
    name: bunksafe
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    disk:
      name: bunksafe-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BUNKSAFE_ENV
        value: production
      - key: BUNKSAFE_HTTPS
        value: "1"
      - key: BUNKSAFE_DB_PATH
        value: /var/data/bunksafe.db
      - key: BUNKSAFE_BACKUP_DIR
        value: /var/data/backups
      - key: BUNKSAFE_SECRET_KEY
        generateValue: true
      - key: BUNKSAFE_ADMIN_EMAIL
        sync: false
      - key: BUNKSAFE_ADMIN_PASSWORD
        sync: false
